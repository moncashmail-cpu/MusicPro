version: '3.8'

services:
  # Base de données relationnelle
  postgres:
    image: postgres:16-alpine
    container_name: musikpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musikpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musikpro_secret}
      POSTGRES_DB: ${POSTGRES_DB:-musikpro_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musikpro -d musikpro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker & Backend pour Celery
  redis:
    image: redis:7-alpine
    container_name: musikpro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stockage d'objets compatible S3 (MinIO)
  minio:
    image: minio/minio:latest
    container_name: musikpro-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Backend API (FastAPI)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: musikpro-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://musikpro:musikpro_secret@postgres:5432/musikpro_db
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: musikpro-media
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./shared:/app/shared

  # Worker Asynchrone (Celery + OMR + Synth)
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: musikpro-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://musikpro:musikpro_secret@postgres:5432/musikpro_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: musikpro-media
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - ./shared:/app/shared

  # Frontend Web (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: musikpro-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./shared:/app/shared

volumes:
  postgres_data:
  redis_data:
  minio_data:
